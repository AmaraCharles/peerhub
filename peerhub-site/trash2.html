<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onboard Personal</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./OnboardHero.css" />
  </head>

  <style>
@font-face {
  font-family: "Onboard Midnight";
  src: url("/__mockup/fonts/MidnightHeavy.otf") format("opentype");
  font-style: normal;
  font-weight: 900;
  font-display: swap;
}

@font-face {
  font-family: "Onboard Euclid";
  src: url("/__mockup/fonts/EuclidRegular.ttf") format("truetype");
  font-style: normal;
  font-weight: 400;
  font-display: swap;
}

@font-face {
  font-family: "Onboard Euclid";
  src: url("/__mockup/fonts/EuclidSemiBold.ttf") format("truetype");
  font-style: normal;
  font-weight: 600;
  font-display: swap;
}

:root {
  --onboard-black: #1d1700;
  --onboard-cream: #fcf8e6;
  --onboard-lime: #c6ff00;
}

html,
body {
  min-height: 100%;
  margin: 0;
}

body {
  background: var(--onboard-cream);
}

.onboard-hero-page {
  min-height: 100%;
  margin: 0;
  background: var(--onboard-cream);
  color: var(--onboard-black);
  font-family: "Onboard Euclid", Arial, sans-serif;
}

.onboard-hero,
.onboard-hero * {
  box-sizing: border-box;
}

.onboard-hero {
  position: relative;
  isolation: isolate;
  min-height: 900px;
  height: 100vh;
  overflow: hidden;
  background-color: var(--onboard-cream);
  background-image: url("/__mockup/images/Hero-image_composition_2.avif");
  background-position: center top;
  background-repeat: no-repeat;
  background-size: cover;
}

.onboard-hero::after {
  position: absolute;
  z-index: -1;
  right: -8%;
  bottom: -30%;
  left: -8%;
  height: 52%;
  content: "";
  background: linear-gradient(180deg, transparent, rgb(29 23 0 / 0.1));
  pointer-events: none;
}

.onboard-nav {
  position: absolute;
  z-index: 5;
  top: 30px;
  right: 0;
  left: 0;
  display: flex;
  align-items: center;
  width: min(90%, 1728px);
  min-height: 64px;
  margin: 0 auto;
  padding: 0 20px 0 38px;
  border-radius: 999px;
  background: rgb(255 255 255 / 0.23);
  backdrop-filter: blur(2px);
}

.onboard-brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--onboard-black);
  font-size: 31px;
  font-weight: 600;
  letter-spacing: -1.8px;
  line-height: 1;
  text-decoration: none;
}

.onboard-brand-mark {
  width: 27px;
  height: 27px;
  transform: rotate(-24deg);
}

.onboard-brand-mark::before,
.onboard-brand-mark::after {
  display: block;
  width: 25px;
  height: 10px;
  border: 3px solid currentColor;
  border-radius: 50%;
  content: "";
}

.onboard-brand-mark::before {
  transform: translateY(3px) rotate(24deg);
}

.onboard-brand-mark::after {
  transform: translateY(-3px) rotate(24deg);
}

.onboard-mode-switch {
  display: inline-flex;
  margin-left: 17px;
  padding: 3px;
  border-radius: 999px;
  background: var(--onboard-black);
  font-size: 15px;
  line-height: 1;
}

.onboard-mode-switch a {
  padding: 9px 14px 10px;
  border-radius: 999px;
  color: var(--onboard-cream);
  text-decoration: none;
}

.onboard-mode-switch a[aria-current="page"] {
  background: #fff;
  color: var(--onboard-black);
}

.onboard-nav-links {
  display: flex;
  align-items: center;
  gap: 35px;
  margin-left: auto;
  font-size: 16px;
}

.onboard-nav-links a {
  color: var(--onboard-black);
  text-decoration: none;
  white-space: nowrap;
}

.onboard-products {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.onboard-chevron {
  width: 8px;
  height: 8px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg) translateY(-2px);
}

.onboard-signup {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 99px;
  min-height: 40px;
  padding: 8px 20px;
  border-radius: 999px;
  background: var(--onboard-lime);
  color: var(--onboard-black) !important;
  transition: transform 180ms ease, box-shadow 180ms ease;
}

.onboard-signup:hover,
.onboard-cta:hover {
  box-shadow: 0 8px 18px rgb(29 23 0 / 0.17);
  transform: translateY(-2px);
}

.onboard-hero-content {
  position: absolute;
  z-index: 2;
  top: 260px;
  left: clamp(32px, 5vw, 96px);
  display: flex;
  flex-direction: column;
  align-items: center;
  width: min(49vw, 580px);
  text-align: center;
}

.onboard-title {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0;
  color: var(--onboard-cream);
  font-family: "Onboard Midnight", Impact, sans-serif;
  font-size: clamp(68px, 6.46vw, 124px);
  font-weight: 900;
  letter-spacing: -0.035em;
  line-height: 1.03;
  text-transform: uppercase;
}

.onboard-title-line {
  display: inline-block;
  padding: 11px 30px 13px;
  background: var(--onboard-black);
  white-space: nowrap;
}

.onboard-title-line:first-child {
  align-self: flex-start;
  margin-left: 0;
}

.onboard-title-line:last-child {
  align-self: flex-end;
  margin-right: 37px;
}

.onboard-title-minus {
  z-index: 1;
  display: inline-block;
  margin: -31px 0 -29px;
  padding: 0 30px 5px;
  background: #ff3718;
  color: var(--onboard-cream);
  transform: rotate(-4deg);
}

.onboard-subtitle {
  max-width: 317px;
  margin: 43px 0 0;
  font-size: 24px;
  letter-spacing: -0.025em;
  line-height: 1.5;
}

.onboard-cta {
  display: inline-flex;
  align-items: center;
  gap: 15px;
  min-height: 72px;
  margin-top: 49px;
  padding: 14px 24px 16px 39px;
  border: 0;
  border-radius: 999px;
  background: var(--onboard-lime);
  color: var(--onboard-black);
  cursor: pointer;
  font-family: "Onboard Midnight", Impact, sans-serif;
  font-size: 24px;
  font-weight: 900;
  line-height: 1;
  text-decoration: none;
  text-transform: uppercase;
  transition: transform 180ms ease, box-shadow 180ms ease;
}

.onboard-cta-arrow {
  display: inline-block;
  width: 22px;
  height: 14px;
  border-top: 2px solid currentColor;
  border-right: 2px solid currentColor;
  transform: rotate(45deg) scale(0.72);
}

.onboard-cta-arrow::before {
  display: block;
  width: 28px;
  margin-top: 5px;
  margin-left: -7px;
  border-top: 2px solid currentColor;
  content: "";
  transform: rotate(-45deg);
}

.onboard-alert {
  position: absolute;
  z-index: 3;
  width: min(25.5vw, 407px);
  filter: drop-shadow(0 10px 18px rgb(29 23 0 / 0.07));
  animation: onboard-float 5s ease-in-out infinite;
}

.onboard-alert img {
  display: block;
  width: 100%;
  height: auto;
}

.onboard-alert-funded {
  right: 26.3%;
  bottom: 26.3%;
}

.onboard-alert-allowance {
  right: 20.5%;
  bottom: 12%;
  width: min(25.5vw, 407px);
  animation-delay: -1.2s;
}

.onboard-alert-success {
  right: 9.4%;
  bottom: 2.7%;
  width: min(25.5vw, 407px);
  animation-delay: -2.4s;
}

@keyframes onboard-float {
  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-7px);
  }
}

@media (max-width: 1100px) {
  .onboard-nav {
    width: 96%;
    padding-left: 24px;
  }

  .onboard-nav-links {
    gap: 22px;
  }

  .onboard-hero-content {
    top: 245px;
    left: 3%;
    width: 51%;
  }

  .onboard-title-line {
    padding-right: 24px;
    padding-left: 24px;
  }
}

@media (max-width: 760px) {
  .onboard-hero {
    min-height: 780px;
    height: 100svh;
    background-image: url("/__mockup/images/Hero-image_composition_2.avif");
    background-position: 60% top;
  }

  .onboard-nav {
    top: 16px;
    width: calc(100% - 28px);
    min-height: 55px;
    padding: 0 12px 0 17px;
  }

  .onboard-brand {
    gap: 6px;
    font-size: 23px;
    letter-spacing: -1.2px;
  }

  .onboard-brand-mark {
    width: 21px;
    height: 21px;
    transform: scale(0.78) rotate(-24deg);
  }

  .onboard-mode-switch {
    margin-left: 9px;
    font-size: 12px;
  }

  .onboard-mode-switch a {
    padding: 7px 9px 8px;
  }

  .onboard-nav-links {
    display: none;
  }

  .onboard-hero-content {
    top: 156px;
    right: 14px;
    left: 14px;
    width: auto;
  }

  .onboard-title {
    font-size: clamp(47px, 15vw, 85px);
    line-height: 1.02;
  }

  .onboard-title-line {
    padding: 8px 16px 9px;
  }

  .onboard-title-line:first-child {
    align-self: center;
  }

  .onboard-title-line:last-child {
    align-self: center;
    margin-right: 0;
  }

  .onboard-title-minus {
    margin: -11px 0 -10px;
    padding: 0 18px 4px;
  }

  .onboard-subtitle {
    max-width: 260px;
    margin-top: 28px;
    font-size: 18px;
    line-height: 1.38;
  }

  .onboard-cta {
    min-height: 60px;
    margin-top: 28px;
    padding: 13px 19px 14px 27px;
    font-size: 18px;
  }

  .onboard-alert {
    width: 58vw;
  }

  .onboard-alert-funded {
    right: 6%;
    bottom: 22%;
  }

  .onboard-alert-allowance {
    right: 0;
    bottom: 12%;
    width: 58vw;
  }

  .onboard-alert-success {
    right: -11%;
    bottom: 3%;
    width: 58vw;
  }
}

@media (prefers-reduced-motion: reduce) {
  .onboard-alert,
  .onboard-signup,
  .onboard-cta {
    animation: none;
    transition: none;
  }
}
</style>
  <body>
    <main class="onboard-hero-page">
      <section class="onboard-hero" aria-label="Onboard personal banking">
        <nav class="onboard-nav" aria-label="Primary navigation">
          <a class="onboard-brand" href="#" aria-label="Onboard home">
            <span class="onboard-brand-mark" aria-hidden="true"></span>
            <span>onboard</span>
          </a>

          <div class="onboard-mode-switch" aria-label="Account type">
            <a href="#" aria-current="page">Personal</a>
            <a href="#">Business</a>
          </div>

          <div class="onboard-nav-links">
            <a class="onboard-products" href="#">
              Products <span class="onboard-chevron" aria-hidden="true"></span>
            </a>
            <a href="#">Blog</a>
            <a href="#">Refer &amp; earn</a>
            <a href="#">Help</a>
            <a class="onboard-signup" href="#">Sign up</a>
          </div>
        </nav>

        <div class="onboard-hero-content">
          <h1 class="onboard-title">
            <span class="onboard-title-line">Your Money,</span>
            <span class="onboard-title-minus">Minus</span>
            <span class="onboard-title-line">the Worry</span>
          </h1>

          <p class="onboard-subtitle">
            Send globally, spend freely, and receive money easily - you're in
            charge.
          </p>

          <a class="onboard-cta" href="#">
            <span>Get Onboard</span>
            <span class="onboard-cta-arrow" aria-hidden="true"></span>
          </a>
        </div>

        <div class="onboard-alert onboard-alert-funded">
          <img
            src="/__mockup/images/Frame-1321314786.png"
            alt="Virtual account funded, plus 1,680 EUR"
          />
        </div>
        <div class="onboard-alert onboard-alert-allowance">
          <img
            src="/__mockup/images/Frame-1321314787.png"
            alt="Monthly allowance, plus 213 USD"
          />
        </div>
        <div class="onboard-alert onboard-alert-success">
          <img
            src="/__mockup/images/Frame-1321314766.png"
            alt="Payment successful, minus 4.20 USD"
          />
        </div>
      </section>
    </main>
  </body>
</html>
